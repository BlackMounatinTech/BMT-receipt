<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#182d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BMT Hiring">
<title>{% block title %}BMT Closer Hiring{% endblock %}</title>
<style>
:root{color-scheme:light;--ink:#20322b;--muted:#626c65;--paper:#f6f5f0;--line:#dcded5;--green:#234c3a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;line-height:1.65}header{background:#182d26;color:#fff;padding:20px max(22px,calc((100vw - 760px)/2));font-size:13px;letter-spacing:.13em;text-transform:uppercase}main{max-width:760px;margin:auto;padding:44px 24px 72px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin:0 0 12px}h1{font-size:clamp(32px,7vw,48px);line-height:1.12;letter-spacing:-.035em;margin:0 0 18px}h2{font-size:25px;line-height:1.25;letter-spacing:-.02em;margin:0 0 20px}h3{font-size:19px;line-height:1.45;margin:26px 0 8px}.intro,.hint{color:var(--muted)}.hint{font-size:15px;margin:6px 0 20px}section{border-top:1px solid var(--line);margin-top:36px;padding-top:30px}.number{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--green);margin-bottom:9px}.script{background:#fff;border-left:3px solid #63846d;padding:22px 24px;margin:18px 0;border-radius:0 12px 12px 0}.script p:first-child{margin-top:0}.script p:last-child{margin-bottom:0}ul,ol{padding-left:24px}li{margin:12px 0}p{margin:12px 0}a{color:var(--green);text-underline-offset:4px}.button{display:inline-block;background:var(--green);color:white;padding:14px 20px;text-decoration:none;border-radius:8px;font-size:16px;font-weight:650;margin-top:12px}.offer{font-size:16px;background:#e9ede4;padding:18px 22px;border-radius:12px}.offer p{margin:8px 0}.label{font-size:14px;font-weight:600;color:var(--muted)}.questionnaire{white-space:pre-wrap;font:inherit;line-height:1.7;overflow-wrap:anywhere;background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:24px;user-select:text}.footer{font-size:14px;color:var(--muted);margin-top:40px} @media(max-width:480px){main{padding:32px 20px 60px}.script{padding:18px}.questionnaire{padding:18px}section{margin-top:30px;padding-top:26px}}@media print{header,.button,.footer{display:none}body{background:white;font-size:12pt}main{padding:0;max-width:none}.script,.offer,.questionnaire{break-inside:avoid}h2,h3{break-after:avoid}section{margin-top:22px}}
</style>
</head><body><header>Black Mountain Technologies</header><main>{% block content %}{% endblock %}</main></body></html>
